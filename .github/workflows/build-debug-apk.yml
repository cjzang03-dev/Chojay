name: Build debug APK

# Builds a debug APK in CI so an installable APK can be produced without
# relying on a local machine's hardware/RAM. Uses a fixed debug keystore
# (stored as the DEBUG_KEYSTORE_BASE64 secret) rather than letting each
# runner generate its own random one, so the SHA-1 registered with the
# Google OAuth Android client stays valid across builds.
on:
  push:
    branches:
      - claude/sweet-wozniak-n0apwp
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Create env.json from repository secrets
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          GOOGLE_WEB_CLIENT_ID: ${{ secrets.GOOGLE_WEB_CLIENT_ID }}
        run: |
          cat > env.json <<EOF
          {
            "SUPABASE_URL": "$SUPABASE_URL",
            "SUPABASE_ANON_KEY": "$SUPABASE_ANON_KEY",
            "GOOGLE_WEB_CLIENT_ID": "$GOOGLE_WEB_CLIENT_ID"
          }
          EOF

      - name: Verify env.json secrets landed correctly (no secret values printed)
        env:
          GOOGLE_WEB_CLIENT_ID: ${{ secrets.GOOGLE_WEB_CLIENT_ID }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          echo "GOOGLE_WEB_CLIENT_ID length: ${#GOOGLE_WEB_CLIENT_ID}"
          echo "GOOGLE_WEB_CLIENT_ID sha256: $(printf '%s' "$GOOGLE_WEB_CLIENT_ID" | sha256sum | cut -d' ' -f1)"
          echo "Expected sha256 (of 1021329552949-vlk04qlhiqsrhmqvu2pldkthttdhajq9.apps.googleusercontent.com, the client ID actually registered in Supabase's Google provider): $(printf '%s' '1021329552949-vlk04qlhiqsrhmqvu2pldkthttdhajq9.apps.googleusercontent.com' | sha256sum | cut -d' ' -f1)"
          echo "SUPABASE_URL length: ${#SUPABASE_URL}"
          echo "SUPABASE_ANON_KEY length: ${#SUPABASE_ANON_KEY}"

      - run: flutter pub get

      - name: Install fixed debug keystore (stable SHA-1 across builds)
        env:
          DEBUG_KEYSTORE_BASE64: ${{ secrets.DEBUG_KEYSTORE_BASE64 }}
        run: |
          mkdir -p ~/.android
          echo "$DEBUG_KEYSTORE_BASE64" | base64 -d > ~/.android/debug.keystore

      - run: flutter build apk --debug --dart-define-from-file=env.json

      - name: Print debug keystore SHA-1 (for Google OAuth Android client)
        run: |
          keytool -list -v \
            -keystore ~/.android/debug.keystore \
            -alias androiddebugkey \
            -storepass android -keypass android \
            | tee debug-keystore-info.txt
          echo "### Debug keystore SHA-1" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          grep "SHA1:" debug-keystore-info.txt >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          actual_sha1=$(grep "SHA1:" debug-keystore-info.txt | awk '{print $2}')
          # Must match the SHA-1 registered against the Android OAuth client
          # (package com.journeyinbhutan.chojay) in Google Cloud Console —
          # otherwise native Google Sign-In fails with ApiException: 10
          # (DEVELOPER_ERROR) before it ever reaches Supabase.
          expected_sha1="77:3F:46:62:B7:C9:A6:38:B3:0A:67:4F:03:DA:A1:BF:8A:31:BA:A5"
          if [ "$actual_sha1" != "$expected_sha1" ]; then
            echo "::warning::Debug keystore SHA-1 ($actual_sha1) no longer matches the last-known-good Android OAuth client SHA-1 ($expected_sha1). If you intentionally rotated the debug keystore, update the Android OAuth client's SHA-1 in Google Cloud Console AND this workflow's expected_sha1 to match."
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk

      - uses: actions/upload-artifact@v4
        with:
          name: debug-keystore-info
          path: debug-keystore-info.txt
